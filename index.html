<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container g-0">
        <div class="row borda">
            <div class="col">
                <h1 class="text-center">Cadastro</h1>
                <form>
                    <label class="form-label" for="nome">Insira o seu nome:</label>
                    <input class="form-control" type="text" id="nome">

                    <label class="form-label" for="email">Digíte o seu e-mail:</label>
                    <input class="form-control" type="email" id="email">

                    <label class="form-label" for="tel">Digíte o seu número:</label>
                    <input class="form-control" type="tel" id="tel">

                    <div class="form-check form-switch">
                        <label class="form-check-label" for="termos">Li e concordo com os termos do site</label>
                        <input class="form-check-input" type="checkbox" name="termos" id="termos">
                    </div>
                    <button class="btn btn-success w-100" type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
