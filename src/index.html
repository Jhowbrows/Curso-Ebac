<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+IN:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>
<body>
    <main>
        <div class="container">
            <h1>Sorteio</h1>
            <form id="form-sorteador">
                <div>
                    <label for="numero-maximo">Número máximo</label>
                    <input type="number" id="numero-maximo" required min="2" value="2" step="1"> 
                </div>
                <button type="submit">Sortear</button>
            </form>

            <div class="resultado">
                O número sorteado foi: <span id="resultado-valor"></span>
            </div>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
